# AikidoSec/safe-chain を利用して、悪意ある npm パッケージが含まれていないかチェックする
# https://github.com/AikidoSec/safe-chain
name: Check npm packages by AikidoSec Safe Chain

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - package-lock.json
      - yarn.lock
      - pnpm-lock.yaml

env:
  AIKIDO_SAFE_CHAIN_VERSION: '1.5.20'
  AIKIDO_SAFE_CHAIN_INSTALLER_SHA256: '0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd'
  # .yarnrc.yml の npmPreapprovedPackages と同じ意図。
  # safe-chain 側にも最小公開経過日数のフィルタがあるため、
  # 自分たちのスコープだけ対象外にする（マルウェア検査自体は有効のまま）
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: '@mitsuharu/*'

permissions:
  contents: read

concurrency:
  group: aikidosec-safe-chain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-npm-packages-by-aikidosec-safe-chain:
    # 2025/12/18 時点では runner を ubuntu-slim にすると、AikidoSec/safe-chain が動作しない
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # どのパッケージマネージャーのファイルが変更されたかを検出する
      # ni などパッケージマネージャーのラッパーツールは、safe-chain が対応していないため、直接 lockfile を見る
      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            manifest:
              - 'package.json'
            npm:
              - 'package-lock.json'
            yarn:
              - 'yarn.lock'
            pnpm:
              - 'pnpm-lock.yaml'
      
      # 1つだけ許可：複数 lockfile が変わったら fail
      - name: Fail if multiple lockfiles changed
        run: |
          count=0
          [[ "${{ steps.changes.outputs.npm }}" == "true" ]] && count=$((count+1))
          [[ "${{ steps.changes.outputs.yarn }}" == "true" ]] && count=$((count+1))
          [[ "${{ steps.changes.outputs.pnpm }}" == "true" ]] && count=$((count+1))

          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple lockfiles were changed in this PR. Please update only one package manager lockfile."
            exit 1
          fi
      
      # Node.jsをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      # AikidoSec Safe Chain をセットアップ
      # インストーラーはバージョンを固定し、チェックサムを検証してから実行する
      # （ダウンロードしたスクリプトをそのままパイプで実行しない）
      - name: Install safe-chain
        run: |
          curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${AIKIDO_SAFE_CHAIN_VERSION}/install-safe-chain.sh" -o /tmp/install-safe-chain.sh
          echo "${AIKIDO_SAFE_CHAIN_INSTALLER_SHA256}  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      # AikidoSec Safe Chain を実行 (npm)
      - name: Install dependencies (npm ci)
        if: steps.changes.outputs.npm == 'true'
        run: |
          npm ci

      # AikidoSec Safe Chain を実行 (yarn)
      - name: Install dependencies (yarn immutable)
        if: steps.changes.outputs.yarn == 'true'
        run: |
          corepack enable || true
          yarn install --immutable

      # AikidoSec Safe Chain を実行 (pnpm)
      - name: Install dependencies (pnpm frozen-lockfile)
        if: steps.changes.outputs.pnpm == 'true'
        run: |
          corepack enable || true
          pnpm install --frozen-lockfile
