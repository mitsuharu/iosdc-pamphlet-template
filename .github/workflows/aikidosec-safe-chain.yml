# AikidoSec/safe-chain を利用して、悪意ある npm パッケージが含まれていないかチェックする
# https://github.com/AikidoSec/safe-chain
#
# このリポジトリはテンプレートなので、使う人がどのパッケージマネージャーを
# 選ぶか分からない。そこで、差分ではなくリポジトリの中身から判定する。
# 差分（どのロックファイルが変わったか）で判定すると、package.json だけを
# 変更した PR ではどれも真にならず、検査が素通りしてしまうため。

name: Check npm packages by AikidoSec Safe Chain

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - yarn.lock
      - pnpm-lock.yaml
      # 依存の解決先や取得の条件を変えるファイル
      - .yarnrc.yml
      - .npmrc
      # このワークフロー自体を変更したときも動かして確かめる
      - .github/workflows/aikidosec-safe-chain.yml

env:
  AIKIDO_SAFE_CHAIN_VERSION: '1.5.20'
  AIKIDO_SAFE_CHAIN_INSTALLER_SHA256: '0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd'
  # .yarnrc.yml の npmPreapprovedPackages と同じ意図。
  # safe-chain 側にも最小公開経過日数のフィルタがあるため、
  # 自分たちのスコープだけ対象外にする（マルウェア検査自体は有効のまま）
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: '@mitsuharu/*'

permissions:
  contents: read

concurrency:
  group: aikidosec-safe-chain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-npm-packages-by-aikidosec-safe-chain:
    # 2025/12/18 時点では runner を ubuntu-slim にすると、AikidoSec/safe-chain が動作しない
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node.jsをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      # 使うパッケージマネージャーを決める
      #   1. package.json の packageManager フィールド（corepack の標準）
      #   2. 置かれているロックファイル
      - name: Detect package manager
        id: pm
        run: |
          MANAGER=$(node -p "(require('./package.json').packageManager || '').split('@')[0]" 2>/dev/null || echo "")

          if [ -n "${MANAGER}" ]; then
            echo "packageManager フィールドから判定しました: ${MANAGER}"
          else
            FOUND=""
            [ -f yarn.lock ] && FOUND="${FOUND} yarn"
            [ -f pnpm-lock.yaml ] && FOUND="${FOUND} pnpm"
            { [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; } && FOUND="${FOUND} npm"
            # shellcheck disable=SC2086
            set -- ${FOUND}

            if [ "$#" -eq 0 ]; then
              echo "::error::パッケージマネージャーを判定できません。package.json に packageManager を書くか、ロックファイルをコミットしてください。"
              exit 1
            fi
            if [ "$#" -gt 1 ]; then
              echo "::error::ロックファイルが複数あります ($*)。package.json の packageManager で使うものを明示してください。"
              exit 1
            fi

            MANAGER="$1"
            echo "ロックファイルから判定しました: ${MANAGER}"
          fi

          case "${MANAGER}" in
            npm | yarn | pnpm) ;;
            *)
              echo "::error::このワークフローが対応していないパッケージマネージャーです: ${MANAGER}"
              exit 1
              ;;
          esac

          echo "manager=${MANAGER}" >> "$GITHUB_OUTPUT"

      # AikidoSec Safe Chain をセットアップ
      # インストーラーはバージョンを固定し、チェックサムを検証してから実行する
      # （ダウンロードしたスクリプトをそのままパイプで実行しない）
      - name: Install safe-chain
        run: |
          curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${AIKIDO_SAFE_CHAIN_VERSION}/install-safe-chain.sh" -o /tmp/install-safe-chain.sh
          echo "${AIKIDO_SAFE_CHAIN_INSTALLER_SHA256}  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      # ロックファイルどおりに依存をインストールする
      # safe-chain が割り込み、悪意あるパッケージを検出すると失敗する
      - name: Install dependencies
        env:
          MANAGER: ${{ steps.pm.outputs.manager }}
        run: |
          case "${MANAGER}" in
            yarn)
              corepack enable
              INSTALL="yarn install --immutable"
              ;;
            pnpm)
              corepack enable
              INSTALL="pnpm install --frozen-lockfile"
              ;;
            npm)
              INSTALL="npm ci"
              ;;
          esac

          echo "実行: ${INSTALL}"
          if ! ${INSTALL}; then
            echo "::error::インストールに失敗しました。package.json の依存を変更してロックファイルを更新していない場合は、手元でインストールし直して、ロックファイルもコミットしてください。"
            exit 1
          fi
