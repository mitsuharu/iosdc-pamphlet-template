# Dependabot が @vivliostyle/cli を更新する PR を作ったら、
# Makefile の Docker イメージのタグも同じバージョンに合わせる。
#
# package.json（npm 実行用）と Makefile（Docker 実行用）で
# CLI のバージョンがずれると、入稿用 PDF だけ古い CLI でビルドされてしまう。

name: Update Makefile for Vivliostyle CLI

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-makefile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-makefile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      # PR タイトルからバージョンを取り出して Makefile を更新する
      #
      # PR タイトルは第三者が指定しうる値なので、run の中に
      # ${{ }} で直接展開せず、環境変数を経由して渡す
      # （シェルへのコマンドインジェクションを防ぐため）
      - name: Update Makefile
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: ${PR_TITLE}"

          if [[ ! "${PR_TITLE}" =~ ^Bump\ @vivliostyle/cli\ from\ .*\ to\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Vivliostyle CLI の更新 PR ではないので何もしません。"
            exit 0
          fi

          NEW_VERSION="${BASH_REMATCH[1]}"
          echo "New version: ${NEW_VERSION}"

          sed -i "s/^VIVLIOSTYLE_CLI_IMAGE_TAG := .*/VIVLIOSTYLE_CLI_IMAGE_TAG := ${NEW_VERSION}/" Makefile

          if git diff --quiet -- Makefile; then
            echo "Makefile はすでに ${NEW_VERSION} なので、コミットしません。"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Makefile
          git commit -m "Update VIVLIOSTYLE_CLI_IMAGE_TAG to ${NEW_VERSION}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
